appId: com.rpglife.app
productName: RPG Life
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - electron/**/*
  - package.json
asar: true

mac:
  category: public.app-category.productivity
  target:
    - dmg
    - zip

win:
  target:
    - nsis
  nsis:
    oneClick: false
    allowToChangeInstallationDirectory: true

linux:
  target:
    - AppImage
  category: Utility
