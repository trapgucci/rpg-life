appId: com.rpglife.app
productName: RPG Life
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - electron/**/*
  - package.json
asar: true

extraResources:
  - from: build/icon.png
    to: icon.png

toolsets:
  winCodeSign: "1.0.0"

mac:
  category: public.app-category.productivity
  target:
    - dmg
    - zip

win:
  target:
    - nsis
    - zip

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

linux:
  target:
    - AppImage
  category: Utility
